# DO NOT commit real secrets. Use Sealed Secrets or External Secrets Operator.
# This is a template only — values should be base64 encoded.
apiVersion: v1
kind: Secret
metadata:
  name: nexchat-secrets
  namespace: nexchat
type: Opaque
data:
  MONGODB_URI: <base64-encoded-mongodb-uri>
  JWT_SECRET: <base64-encoded-jwt-secret>
  JWT_REFRESH_SECRET: <base64-encoded-refresh-secret>
  REDIS_URL: <base64-encoded-redis-url>
  CLOUDINARY_CLOUD_NAME: <base64-encoded>
  CLOUDINARY_API_KEY: <base64-encoded>
  CLOUDINARY_API_SECRET: <base64-encoded>
  GEMINI_API_KEY: <base64-encoded>
  SMTP_USER: <base64-encoded>
  SMTP_PASS: <base64-encoded>
  ENCRYPTION_KEY: <base64-encoded>
