apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexchat-server
  namespace: nexchat
  labels:
    app: nexchat-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexchat-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexchat-server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [nexchat-server]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: your-registry/nexchat-server:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: nexchat-config
            - secretRef:
                name: nexchat-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexchat-server
  namespace: nexchat
spec:
  selector:
    app: nexchat-server
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
